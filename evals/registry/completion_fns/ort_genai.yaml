qwen/qwen3.6-nvfp4-fp8dense-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp8_dense_onnx
