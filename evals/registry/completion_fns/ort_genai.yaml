    top_p: 0.95
    top_k: 32
    repetition_penalty: 1.15
    disable_thinking: false
    model_name: qwen3.6-nvfp4-fp8dense

# Same as qwen3.6-nvfp4-fp8dense but WITHOUT repetition_penalty (1.0). Mirrors the
# vLLM no-rep run to test whether rep_penalty is the source of the gap to fp16.
qwen/qwen3.6-nvfp4-fp8dense-norep-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp8_dense_onnx
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    do_sample: true
    temperature: 1.0
    top_p: 0.95
    top_k: 32
    repetition_penalty: 1.0
    disable_thinking: false
    model_name: qwen3.6-nvfp4-fp8dense-norep

# fp8dense but FP8 attention activations quantized with the checkpoint's static
# calibrated per-tensor input_scale (ModelOpt W8A8 / vLLM scheme) instead of dynamic
# absmax. No repetition_penalty -> mirrors the vLLM no-rep run (82.9%) to test whether
# the calibrated activation scale closes the ORT->vLLM gap. Sanity: 0/21 greedy loops.
