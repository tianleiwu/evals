    do_sample: true
    temperature: 1.0
    top_p: 0.95
    top_k: 32
    repetition_penalty: 1.0
    disable_thinking: false
    model_name: qwen3.6-nvfp4-statscale-norep

qwen/qwen3.6-nvfp4-statscale-fp8kv-norep-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp8dense_statscale_fp8kv_onnx
    execution_provider: cuda
