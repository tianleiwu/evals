    top_k: 32
    repetition_penalty: 1.15
    disable_thinking: false
    model_name: qwen3.6-nvfp4-fp8attn

# nvfp4 MoE (QMoE) + shared_expert/lm_head NVFP4 (MatMulBlockScaledFp4) + fp8
# attention q/k/v/o (MatMulBlockScaledFp8, single-block per-tensor scale) loaded
# directly from the NVIDIA ModelOpt checkpoint; linear_attn + router + gates fp16.
qwen/qwen3.6-nvfp4-fp8dense-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp8_dense_onnx
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
