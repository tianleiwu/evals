    top_k: 32
    repetition_penalty: 1.15
    disable_thinking: false
    model_name: qwen3.6-nvfp4-fp8attn

# nvfp4 MoE (QMoE) + shared_expert/lm_head NVFP4 (MatMulBlockScaledFp4) + fp8
