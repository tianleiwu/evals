    temperature: 1.0
    top_p: 0.95
    top_k: 32
    repetition_penalty: 1.0
    disable_thinking: false
    model_name: qwen3.6-nvfp4-statscale-mtp-fp8kv-sample

qwen/qwen3.6-int4b32-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models/qwen3.6_int4_b32_onnx
