    top_k: 32
    repetition_penalty: 1.0
    disable_thinking: false
    model_name: qwen3.6-nvfp4-statscale-fp8kv-norep

# MTP (multi-token prediction) self-speculative decoding variant of the statscale
# final candidate. main = statscale nvfp4 model (with hidden_states output);
# mtp_model = int8-quantized 1-layer MTP draft head. GREEDY decoding (do_sample=false)
# is used because MTP argmax verification makes the accepted-token sequence LOSSLESS
# vs the base model's greedy output -- so accuracy must equal base-greedy while
# throughput improves on structured content (~1.05-1.15x). This entry evaluates that
# the MTP draft/verify loop preserves MMLU-Pro quality.
# Base statscale GREEDY (no MTP) -- control for the MTP-greedy run, to check whether a
# low greedy MMLU-Pro score is a greedy artifact (base==MTP, MTP lossless) or an MTP bug.
qwen/qwen3.6-nvfp4-statscale-greedy-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp8dense_statscale_onnx
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    do_sample: false
    repetition_penalty: 1.0
    disable_thinking: false
    model_name: qwen3.6-nvfp4-statscale-greedy

qwen/qwen3.6-nvfp4-statscale-mtp-greedy-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp8dense_statscale_mtp_int8head_onnx
    mtp_model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp8dense_statscale_mtp_int8head
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
