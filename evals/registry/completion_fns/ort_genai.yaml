# ---------------------------------------------------------------------------
# SMOKE variants (max_new_tokens=1024) for fast candidate screening on an
# 800-sample MMLU-Pro pilot. The NVFP4 baseline gets a matching smoke fn so the
# screen is apples-to-apples. Use the non-smoke (4096-token) fns above for the
# full 12032-question run once a candidate recipe is finalized.
# ---------------------------------------------------------------------------
qwen/qwen3.6-nvfp4-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models/qwen3.6_nvfp4_onnx
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    do_sample: true
    temperature: 1.0
    top_p: 0.95
    top_k: 32
    repetition_penalty: 1.15
    disable_thinking: false
    model_name: qwen3.6-nvfp4

# nvfp4 MoE (direct-from-safetensor, lossless) + FP16 dense (attention/linear_attn/
# shared_expert/lm_head/router kept fp16 via int4_nodes_to_exclude). Isolates whether
# down-quantizing the dense path to int4 (vs NVIDIA's FP8 attention) is the accuracy loss.
qwen/qwen3.6-nvfp4-fp16dense-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp16dense_onnx
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    do_sample: true
    temperature: 1.0
    top_p: 0.95
    top_k: 32
    repetition_penalty: 1.15
    disable_thinking: false
    model_name: qwen3.6-nvfp4-fp16dense

# Same as qwen3.6-nvfp4-fp16dense but WITHOUT repetition_penalty (1.0). Isolation
# probe: fp16 attn + fp16 dense + nvfp4 QMoE experts is the ONLY quantized path
# left (QMoE). If this loops no-rep like fp8dense-norep, the nvfp4 QMoE kernel is
# the repetition source; if robust, the culprit is FP8-attn and/or NVFP4-dense.
qwen/qwen3.6-nvfp4-fp16dense-norep-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp16dense_onnx
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    do_sample: true
    temperature: 1.0
    top_p: 0.95
    top_k: 32
    repetition_penalty: 1.0
    disable_thinking: false
    model_name: qwen3.6-nvfp4-fp16dense-norep

# nvfp4 MoE + INT8 dense (all dense MatMuls int8 via json quant_config; router +
# shared_expert_gate stay fp16). Smaller than fp16-dense; tests 8-bit dense accuracy.
qwen/qwen3.6-nvfp4-int8dense-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_int8dense_onnx
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    do_sample: true
    temperature: 1.0
    top_p: 0.95
    top_k: 32
    repetition_penalty: 1.15
    disable_thinking: false
    model_name: qwen3.6-nvfp4-int8dense

# nvfp4 MoE + FP8 attention/linear-attention projections loaded directly from the
# NVIDIA ModelOpt checkpoint (GemmFloat8 for attn + linear_attn); remaining dense
# matmuls follow the model precision recipe.
qwen/qwen3.6-nvfp4-fp8attn-mcq10-smoke:
  class: evals.completion_fns.ort_genai:ORTGenAICompletionFn
  args:
    model_path: /home/tianlei/models_local/qwen3.6_nvfp4_fp8attn_onnx
    execution_provider: cuda
    max_new_tokens: 8192
    extract_letter_choice: true
