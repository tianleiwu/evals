    do_sample: false
    repetition_penalty: 1.0
    disable_thinking: false
    model_name: qwen3.6-nvfp4-statscale-mtp-greedy

# MTP + FP8 KV cache, SAMPLING, graph ON (validates the recurrent-state double-buffer fix on the
# full vLLM-style + MTP config). Same sampling params as the plain statscale sampling run
# (temp 1.0 / top_p 0.95 / top_k 32 / no rep) for apples-to-apples vs the 82.9% plain baseline.
