# DeepSeek-V4-Flash-0731, served as an 8-rank ONNX export by
# examples/python/deepseek_v4_flash_0731/dsv4_engine.py in onnxruntime-genai.
#
# The model occupies every GPU on the node, so run a single worker:
#
#   OPENAI_API_KEY=dummy EVALS_THREADS=1 \
#     oaieval dsv4/flash-0731-mcq10 match_mmlu_pro_800
#
# `model_path` is the export directory holding rank_<r>/; `checkpoint` is the HF
# checkpoint, used only for its tokenizer and its `encoding/` prompt format.

dsv4/flash-0731:
  class: evals.completion_fns.dsv4:DSV4CompletionFn
  args:
    model_path: /home/tianlei/dsv4_onnx
    checkpoint: /home/tianlei/git/DeepSeek-V4-Flash-0731
    world: 8
    max_new_tokens: 64
    thinking_mode: chat
    model_name: deepseek-v4-flash-0731

# 10-choice variant for MMLU-Pro (options run A..J). The eval's own system
# message already asks for a bare letter, so the budget stays small.
dsv4/flash-0731-mcq10:
  class: evals.completion_fns.dsv4:DSV4CompletionFn
  args:
    model_path: /home/tianlei/dsv4_onnx
    checkpoint: /home/tianlei/git/DeepSeek-V4-Flash-0731
    world: 8
    max_new_tokens: 32
    thinking_mode: chat
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    model_name: deepseek-v4-flash-0731

# Reasoning variant: the model emits <think>...</think> before answering, so the
# budget must cover the chain of thought. The export's context bound is 4096, and
# the engine truncates the generation rather than overrunning the KV cache.
dsv4/flash-0731-think-mcq10:
  class: evals.completion_fns.dsv4:DSV4CompletionFn
  args:
    model_path: /home/tianlei/dsv4_onnx
    checkpoint: /home/tianlei/git/DeepSeek-V4-Flash-0731
    world: 8
    max_new_tokens: 3072
    thinking_mode: thinking
    reasoning_effort: low
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    model_name: deepseek-v4-flash-0731-think

# Paged export (PagedAttention + Lightning Indexer), 10-choice MMLU-Pro variant.
# Same decode settings as dsv4/flash-0731-mcq10 so the two are directly
# comparable: any accuracy gap is the paged path, not the sampling budget.
dsv4/flash-0731-paged-mcq10:
  class: evals.completion_fns.dsv4:DSV4CompletionFn
  args:
    model_path: /home/tianlei/dsv4_onnx_paged
    checkpoint: /home/tianlei/git/DeepSeek-V4-Flash-0731
    world: 8
    max_new_tokens: 32
    thinking_mode: chat
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    model_name: deepseek-v4-flash-0731

# Paged export with the MoE router/GEMV fused into the graph (dsv4_onnx_paged_moe).
# Same decode settings as dsv4/flash-0731-paged-mcq10 so accuracy is comparable.
dsv4/flash-0731-paged-moe-mcq10:
  class: evals.completion_fns.dsv4:DSV4CompletionFn
  args:
    model_path: /home/tianlei/dsv4_onnx_paged_moe
    checkpoint: /home/tianlei/git/DeepSeek-V4-Flash-0731
    world: 8
    max_new_tokens: 32
    thinking_mode: chat
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    model_name: deepseek-v4-flash-0731

# Same export sharded four ways.
dsv4/flash-0731-paged-moe-w4-mcq10:
  class: evals.completion_fns.dsv4:DSV4CompletionFn
  args:
    model_path: /home/tianlei/dsv4_onnx_paged_moe_w4
    checkpoint: /home/tianlei/git/DeepSeek-V4-Flash-0731
    world: 4
    max_new_tokens: 32
    thinking_mode: chat
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    model_name: deepseek-v4-flash-0731

# Earlier paged export that kept QKV unfused, retained for A/B comparisons.
dsv4/flash-0731-paged-qkv-mcq10:
  class: evals.completion_fns.dsv4:DSV4CompletionFn
  args:
    model_path: /home/tianlei/dsv4_onnx_paged_qkv
    checkpoint: /home/tianlei/git/DeepSeek-V4-Flash-0731
    world: 8
    max_new_tokens: 32
    thinking_mode: chat
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    model_name: deepseek-v4-flash-0731

# it11: shared paged addressing, bf16 compressor projections, merged wkv/wgate.
dsv4/flash-0731-it11c-mcq10:
  class: evals.completion_fns.dsv4:DSV4CompletionFn
  args:
    model_path: /home/tianlei/dsv4_onnx_paged_moe_it11c
    checkpoint: /home/tianlei/git/DeepSeek-V4-Flash-0731
    world: 8
    max_new_tokens: 32
    thinking_mode: chat
    extract_letter_choice: true
    choice_letters: ABCDEFGHIJ
    model_name: deepseek-v4-flash-0731
